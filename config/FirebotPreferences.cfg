[firebot_settings]
# Determines if the bot logic should be initialized and started automatically upon game launch.
auto_start = false
# The initial cooldown (in seconds) before the bot begins execution.Useful for preventing conflicts while Unity is still loading the initial scene.Clamped between 10.0 and 120.0 seconds.
start_bot_delay = 10.0
# The interval (in seconds) between each BotManager verification cycle.Lower values make the bot more responsive but may impact FPS performance.Clamped between 5.0 and 3600.0 seconds.
scan_interval = 5.0
# The delay (in seconds) between individual UI interactions (clicks, transitions).Ensures the game processes the command before the next action is taken. Clamped between 0.5 and 5.0 seconds.
interaction_delay = 1.0
# Maximum time (in seconds) a single task is allowed to run before it is aborted.Clamped between 10.0 and 3600.0 seconds.
max_task_runtime = 120.0
# Enables verbose logging and StackTrace display in the console for easier bug identification.
debug_mode = true
# The physical key used to manually toggle the bot's execution state during gameplay.
shortcut_key = "F7"
# Some timers in the game can be sped up for free if the remaining time is below this threshold (default: 170 seconds = 2 minutes and 50 seconds). The maximum allowed value is 180 seconds (3 minutes). Set to 0 to disable free speedup. Adjust this value to account for lag or future game changes. Affects firestone researches, missions, experiments, and map reset timers. If the remaining time is less than or equal to this value, the speedup is free (no gems required).
free_speedup_seconds = 170.0

[alchemist]
# Enables or disables the Alchemist automation task.When disabled, this task will be ignored during the execution loop.
enabled = false
# ALCHEMIST EXPERIMENT RESOURCE CONFIGURATION. This setting controls which experiment resources are used. Valid IDs: 0=Dragon blood, 1=Strange dust, 2=Exotic coin. Enter comma-separated IDs (e.g. '0,1,2'). Any value other than 0, 1, or 2 will be ignored. Default: empty (no resources, bot selects any available resource). EXAMPLES: '0,1' = Use Dragon blood and Strange dust. '2' = Only use Exotic coin.
resource_type = ""
