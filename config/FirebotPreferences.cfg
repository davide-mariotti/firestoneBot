[auto_upgrade]
# The physical key used to manually toggle the AutoUpgrade execution state during gameplay. Default: F6.
shortcut_key = "F6"
# Enables or disables the AutoUpgrade automation task. Starts and stops together with the main bot (shortcut_key in [firebot_settings]). Default: false.
enabled = true
# AUTOUPGRADE TARGET SLOT CONFIGURATION. 
# This setting controls which upgrade slots (leader/heroes) will be upgraded. 
# SLOT IDs ARE ZERO-BASED and range from 0 to 6. 
# SLOT MAP: 0 = Leader, 1 to 6 = Heroes. 
# TASK PRIORITY: Main bot tasks always have priority over AutoUpgrade. 
# AUTO PAUSE/RESUME: AutoUpgrade pauses while a main task is actively executing and resumes automatically right after. 
# HOW TO USE: Enter comma-separated slot IDs to select the targets to upgrade. 
# EXAMPLES: '0,6' = only slots 0 and 6 will be upgraded. '3,1,5' = only slots 3, 1 and 5. 
# If empty, AutoUpgrade will upgrade all slots. 
# Invalid values are ignored.
upgrade_target_slots = ""

